# report env: builds the PDF report only (scripts/build_report_pdf.py, `make report-pdf`; D-107).
# Kept apart from the frozen `tts` env so no pinned training/evaluation package changes.
name: report
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10.22
  - reportlab=5.0.1
  - matplotlib=3.10.9
  - numpy=2.2.6
  - pillow=12.3.0
  - omegaconf=2.4.0
  - pyyaml=6.0.3
