# Base config (docs/PLAN.md Sections 4, 10). Every other config inherits it via `inherit: base.yaml`.
# All paths are relative to the repo root. Later tasks extend this file; they never hard-code values.
seed: 1234
freeze_tag: freeze-v1          # test-speaker audio is locked until this git tag exists (Section 2)

paths:
  raw_lj: data/raw/LJSpeech-1.1
  raw_l2: data/raw/l2arctic
  filelists: data/filelists/vits
  manifests: data/manifests
  splits: data/splits
  reports: reports
  lexicon: data/lexicon/lexicon.txt     # the ONLY source of pronunciations (CLAUDE.md)
  mfa_root: data/models/mfa             # MFA_ROOT_DIR: pretrained models live in the project
  nltk_data: data/models/nltk_data      # g2p_en needs NLTK corpora; kept local for offline use
  mfa_corpus: data/mfa                  # 16 kHz WAV + .lab copies for MFA (Section 2)
  align: data/align                     # MFA TextGrid output
  mfa_tmp: data/mfa_tmp                 # MFA --temporary_directory (kept out of mfa_root)
  stats: stats

audio:                         # Section 4 hyperparameters (VITS LJSpeech)
  sample_rate: 22050
  filter_length: 1024          # n_fft
  win_length: 1024
  hop_length: 256
  n_mels: 80
  mel_fmin: 0.0
  mel_fmax: null

# --- T3: models and data assets (Section 3) ------------------------------------------------
mfa:
  conda_env: mfa
  sample_rate: 16000           # MFA input copies: 16 kHz mono 16-bit (Section 2)
  num_jobs: 8
  # Section 3 decoder settings: pass-through options, validated against MFA's own parameter list
  # (docs/DECISIONS.md D-11), so a typo fails instead of being silently ignored.
  passthrough: {beam: 100, retry_beam: 400}
  acoustic_model: {name: english_us_arpa, version: v3.0.0,
                   sha256: d35ce271ded357d833d2f4b8d1041dc3748b9538567ba13f2c697f4e4126711b}
  g2p_model: {name: english_us_arpa, version: v2.0.0a,     # downloaded per Section 3; NOT used
              sha256: 0ef6a3b288dc0a91a267f98bf556a45bbfeae198e578398e92ac603a61ad46e5}

nltk:
  resources:
    - {id: averaged_perceptron_tagger, path: taggers/averaged_perceptron_tagger.zip,
       sha256: e1f13cf2532daadfd6f3bc481a49859f0b8ea6432ccdcd83e6a49a5f19008de9}
    - {id: cmudict, path: corpora/cmudict.zip,
       sha256: d07cca47fd72ad32ea9d8ad1219f85301eeaf4568f8b6b73747506a71fb5afd6}

# --- T3: text normalizer (Section 2) -------------------------------------------------------
text:
  # Bare 4-digit integers in this range are read as years ("1999" -> "nineteen ninety nine").
  year_range: [1100, 2099]
  # Dotted abbreviations (matched case-insensitively, trailing period required).
  # "st." is special-cased in code: "saint" before a capitalised word, otherwise "street".
  abbreviations:
    mr: mister
    mrs: missus
    ms: miz
    dr: doctor
    jr: junior
    sr: senior
    prof: professor
    capt: captain
    col: colonel
    gen: general
    gov: governor
    lt: lieutenant
    sgt: sergeant
    maj: major
    rev: reverend
    hon: honorable
    esq: esquire
    mt: mount
    ft: fort
    ave: avenue
    blvd: boulevard
    co: company
    corp: corporation
    inc: incorporated
    ltd: limited
    dept: department
    vs: versus
    etc: et cetera
    approx: approximately
  # Multi-dot abbreviations, replaced before dotted initialisms are spelled out.
  phrases:
    "e.g.": for example
    "i.e.": that is
  symbols:
    "&": and
    "@": at
    "+": plus
    "=": equals
    "°": degrees
  currency:            # symbol: [singular, plural, sub-unit singular, sub-unit plural]
    "$": [dollar, dollars, cent, cents]
    "£": [pound, pounds, penny, pence]
    "€": [euro, euros, cent, cents]

# --- T3: lexicon (Section 3) ---------------------------------------------------------------
lexicon:
  # "x's" not in cmudict but "x" is: cmudict(x) + regular suffix (IH0 Z after sibilants,
  # S after voiceless consonants, else Z) instead of g2p_en. docs/DECISIONS.md D-26.
  possessive_rule: true

# --- T4: TextGrid parsing and alignment QC (Section 3) -------------------------------------
align:
  silence_labels: ["", "sil", "sp", "<eps>"]   # align_one writes <eps> for word-tier silence (E-14)
  unknown_label: spn           # failed word: drop the LJ file / trigger fallback at inference
  min_sp_frames: 3             # internal silence >= 3 frames (~35 ms) -> sp, else merged left
  qc:
    max_phone_sec: 0.5         # drop LJ files with a non-silence phone longer than this
    max_frame_diff: 2          # drop if |sum(durations) - n_frames| > this before adjustment
    min_kept_fraction: 0.98    # T4 acceptance: at least 98% of LJ kept

stats:
  min_count: 50                # phones with fewer occurrences use the median sigma (Section 5)

# --- T7: VITS-MFA model (Section 4; VITS LJSpeech defaults) --------------------------------
model:
  inter_channels: 192
  hidden_channels: 192
  filter_channels: 768
  n_heads: 2
  n_layers: 6
  kernel_size: 3
  p_dropout: 0.1
  resblock: "1"
  resblock_kernel_sizes: [3, 7, 11]
  resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
  upsample_rates: [8, 8, 2, 2]
  upsample_initial_channel: 512
  upsample_kernel_sizes: [16, 16, 4, 4]
  use_spectral_norm: false
  dp_filter_channels: 256      # change 4: deterministic DurationPredictor
  dp_kernel_size: 3
  dp_dropout: 0.5
  use_pos: false               # change 5 (M1+pos only)
  n_pos_bins: 16
  add_blank: false             # change 2

pretrained:
  vits_lj: {path: data/models/vits/pretrained_ljs.pth,
            gdrive_folder: 1ksarh-cJf3F5eKJjLVWY0X1j1qsQqiS2, file: pretrained_ljs.pth,
            sha256: c94fb49d08ba90c598de16e7d5dec8d26bf225c1cf193a4fba05eb2dbda5a561}

# --- T8: training (Section 4 hyperparameters) ----------------------------------------------
train:
  segment_size: 8192           # samples
  batch_size: 32               # L40/A100; laptop smoke uses 4 (CLAUDE.md)
  learning_rate: 1.0e-4
  betas: [0.8, 0.99]
  eps: 1.0e-9
  lr_decay: 0.999875           # per epoch
  c_mel: 45
  c_kl: 1.0
  c_dur: 1.0
  c_fm: 1.0                    # VITS feature_loss already returns 2 x sum (Section 4: 2 L_fm)
  precision: bf16              # autocast; STFT, mel and losses in fp32
  cudnn_benchmark: false       # true re-tunes per new shape: 13x slower with variable lengths (E-10)
  grad_clip: null
  max_steps: 100000            # set from the 300-step benchmark (runbook step 2); same for M1/A/B
  ckpt_interval: 2000
  keep_ckpts: 3
  val_interval: 2000
  log_interval: 100
  n_val_audio: 4               # fixed LJ val utterances logged to TensorBoard
  freeze_decoder_steps: 0      # warm-up option (~3000 if the new embedding settles slowly)
  num_workers: 8
  aug_fraction: 0.0            # A/B: 0.4 (60% LJ / 40% augmented rows per batch)
  train_manifests: [data/manifests/lj_train.jsonl]
  aug_manifests: []
  val_manifest: data/manifests/lj_val.jsonl
  init_from: ${pretrained.vits_lj.path}
  runs_dir: runs
  budget_hours: [5, 8, 10]     # --benchmark prints the steps that fit these budgets

# --- T11: evaluation models (Section 8; pinned revisions, stored under data/models) ---------
eval_models:
  root: data/models/eval
  asr: {repo: Systran/faster-whisper-large-v3, revision: edaa852ec7e145841d8ffdb056a99866b5f0a478,
        compute_type: float16, beam_size: 5, language: en}
  speaker: {repo: speechbrain/spkrec-ecapa-voxceleb,
            revision: 0f99f2d0ebe89ac095bcc5903c4dd8f72b367286}
  accent: {repo: Jzuluaga/accent-id-commonaccent_ecapa,
           revision: 14bebf44b7e7a34204d0acc2c897935945fb5c51, us_label: us,
           # classify_batch returns AAM cosine scores; P = softmax(score_scale * cos). Scale 30 =
           # training AdditiveAngularMargin(margin 0.2, scale 30), JuanPZuluaga/accent-recog-slt2022
           # @a2ff115 CommonAccent/accent_id/hparams/train_ecapa_tdnn.yaml (D-65)
           score_scale: 30}
  # model code via torch.hub at the pinned tag (pretrained=False); weights = the release asset that
  # hubconf.py@v1.2.0 names, sha256-pinned and loaded with weights_only=True (D-66)
  utmos: {hub_repo: "tarepan/SpeechMOS:v1.2.0", entry: utmos22_strong,
          weights_url: "https://github.com/tarepan/SpeechMOS/releases/download/v1.0.0/utmos22_strong_step7459_v1.pt",
          weights_sha256: 38aa51ab79e2a4e09a1449758a4b37e9cbb2e8235a49662a732d33a9ba1e9bff}

# --- T9: pace augmentation (Sections 6, 7) -------------------------------------------------
augment:
  seeds: [1234, 1235]          # 2 copies per LJ train utterance
  factor_clip: [0.6, 2.5]      # r_i = clip(exp(z_w * sigma_i))
  crossfade_ms: 10
  room_tone_window_ms: 50      # fallback room tone: lowest-RMS window of the utterance
  # time-varying stretch: wsola (tts/augment/wsola.py, default since D-67) or rubberband (R3,
  # the original PLAN Section 6 choice; ~0.85 UTMOS loss on LJ even at 0.95x/1.05x)
  stretcher: wsola
  wsola: {frame_ms: 15, tolerance_ms: 5}   # chosen on 6 LJ clips x 5 ratios by UTMOS (D-67)
  rubberband_args: {"--fine": ""}   # R3 engine; pitch preserved (stretcher: rubberband)
  audio_format: flac           # lossless 16-bit; half the size of WAV for the GPU bundle (D-45)
  workers: 0                   # 0 = all CPU cores
  out_dir: data/aug
  a:
    z_u: [-1.5, 1.5]           # utterance pace ~ U
    eps_std: 0.5               # z_w = z_u + N(0, 0.5^2)
    sp_factor: [1.0, 3.0]      # each sp x U(1, 3)
    punct_pause_prob: 0.1      # at punctuation boundaries without sp
    punct_pause_ms: [100, 600]
  b:
    stats: stats/l2_dev_pace.json
  filter:
    drop_fraction: 0.05        # drop the 5% with the largest UTMOS drop vs the original
    n_listen: 20               # random kept clips listed in the report

# --- T11: evaluation (Section 8) -----------------------------------------------------------
eval:
  min_pause_s: 0.1             # pause = silence >= 100 ms between two words
  bootstrap: 1000              # resamples over utterances, 95% CI
  boundary_tolerances_ms: [20, 50]

# --- T12: profiling (Section 8 "Efficiency metrics") ---------------------------------------
profile:
  warmup: 10
  runs: 50
  mfa_warmup: 1                # align_one takes ~10-15 s per call: fewer runs (D-55)
  mfa_runs: 5
  tokens_per_second: 12        # synthetic inputs for MACs / RTF-vs-length
  rtf_lengths: [1, 2, 5, 10, 20]
  reference_wav: data/raw/l2arctic/ASI/wav/arctic_a0003.wav     # dev speaker
  reference_txt: data/raw/l2arctic/ASI/transcript/arctic_a0003.txt

# --- make tune (Section 5; dev only) -------------------------------------------------------
tune:
  n_utts: 120                  # fixed dev subset (10 per speaker, round-robin over accents)
  mae_tolerance_ms: 5          # settings within 5 ms of the best word-boundary MAE are eligible

# --- T14: demo page (Section 9) ------------------------------------------------------------
demo:
  n_per_accent: 2
  suitcase_speakers: [BWC, NJS, TNI]   # dev speakers; test-speaker clips only after freeze-v1
  own_recordings: demo/own_recordings  # optional: <name>.wav + <name>.txt, labelled "stress test"
