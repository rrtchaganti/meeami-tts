# Inference pipeline (docs/PLAN.md Section 5). Tuned on dev accents only (`make tune`).
inherit: splits.yaml          # -> base.yaml; needs the test-speaker list for the guard
inference:
  transfer: elastic            # elastic | proportional | phone_copy
  cap: 2.5                     # stretch cap c; null = none  # tuned
  noise_scale: 0.333  # tuned
  aligner: mfa                 # mfa | ctc
  tuning_grid:
    transfer: [elastic, proportional, phone_copy]
    cap: [1.4, 1.6, 1.8, 2.0, 2.5, null]
    noise_scale: [0.333, 0.5, 0.667]
    aligner: [mfa, ctc]

# --- phase 2: within-phone spectral movement, M1+pos vs M1-cont (tts/eval/phone_dynamics.py, D-76)
phone_dynamics:
  manifest: data/manifests/lj_val.jsonl    # LJ val, ground-truth MFA durations
  min_frames: 8                # phones this long or longer (sil/sp excluded)
  noise_scale: 0.333           # = inference.noise_scale (tuned)
  out_dir: results/phone_dynamics

# --- phase 2: paired per-utterance comparison against a control system (tts/eval/paired.py, D-82)
paired:
  metrics: [wb_mae_ms, wb_within20, pause_f1, wer, cer, us_prob, utmos, spk_sim_lj]
  lower_is_better: [wb_mae_ms, wer, cer]
  stretch_quantiles: [0.3333, 0.6667]   # bins of |log stretch_ratio| (near 1.0x .. far from it)
  out_dir: results/paired
